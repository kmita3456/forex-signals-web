<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Forex Signals Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div id="auth-container">
        <h2>Вход</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <button id="login-btn">Войти</button>
        <button id="register-btn">Регистрация</button>
    </div>

    <div id="dashboard" style="display: none;">
        <div class="top-bar">
            <h1>Торговые сигналы</h1>
            <div>
                <button id="theme-toggle-btn">🌙 Тёмная</button>
                <button id="logout-btn">Выйти</button>
                <button id="snake-game-btn">🐍 Играть в змейку</button>
            </div>
        </div>

        <!-- Панель управления -->
        <div id="control-panel">
            <h3>Управление сканированием</h3>
            <label>Валютная пара:
                <select id="sel-symbol">
                    <option value="EURUSD">EURUSD</option>
                    <option value="GBPUSD">GBPUSD</option>
                    <option value="USDCHF">USDCHF</option>
                    <option value="USDJPY">USDJPY</option>
                    <option value="AUDUSD">AUDUSD</option>
                </select>
            </label><br><br>
            <label>Таймфрейм:
                <select id="sel-timeframe">
                    <option value="M5">M5</option>
                    <option value="M10">M10</option>
                    <option value="M15">M15</option>
                    <option value="M20">M20</option>
                    <option value="M30">M30</option>
                </select>
            </label><br><br>
            <label>Время сканирования (мин):
                <input type="number" id="sel-duration" value="5" min="1" max="60">
            </label><br><br>
            <label>Точность:
                <select id="sel-precision">
                    <option value="high">Высокая</option>
                    <option value="medium" selected>Средняя</option>
                    <option value="low">Низкая</option>
                </select>
            </label><br><br>
            <button id="start-scan-btn">Запустить сканирование</button>
            <button id="default-mode-btn">Обычный режим (цикл)</button>
            <p id="scan-status"></p>
        </div>

        <!-- Список сигналов -->
        <div id="signals-list"></div>
    </div>

    <!-- Модальное окно со змейкой (без выбора режима, всегда без стен) -->
    <div id="snake-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Змейка</h2>

            <div class="game-container">
                <canvas id="snake-canvas"></canvas>
                <div class="mobile-controls">
                    <button class="ctrl-btn" data-dir="up">▲</button>
                    <div class="mid-row">
                        <button class="ctrl-btn" data-dir="left">◀</button>
                        <button class="ctrl-btn" data-dir="right">▶</button>
                    </div>
                    <button class="ctrl-btn" data-dir="down">▼</button>
                </div>
            </div>
            <div id="snake-score">Счёт: 0</div>
            <button id="restart-snake-btn">🔄 Заново</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
